name: Azure Container Registry

on:
  workflow_run:
    workflows:
      - Playwright
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io

jobs:
  docker-build:
    name: Build Docker images
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: Backend API
            image: qreveal-backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: Frontend App
            image: qreveal-frontend
            context: frontend
            dockerfile: frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service.context }}
          file: ./${{ matrix.service.dockerfile }}
          push: false
          tags: ${{ matrix.service.image }}:pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.run_number }}
          cache-from: type=gha,scope=${{ matrix.service.image }}

  acr-publish:
    name: Publish Docker images to ACR
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: Backend API
            image: qreveal-backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: Frontend App
            image: qreveal-frontend
            context: frontend
            dockerfile: frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate ACR configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -z "$ACR_NAME" ]; then
            echo "Missing repository variable: AZURE_CONTAINER_REGISTRY_NAME" >&2
            exit 1
          fi
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "Missing repository secret: AZURE_CLIENT_ID" >&2
            exit 1
          fi
          if [ -z "$AZURE_TENANT_ID" ]; then
            echo "Missing repository secret: AZURE_TENANT_ID" >&2
            exit 1
          fi
          if [ -z "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "Missing repository secret: AZURE_SUBSCRIPTION_ID" >&2
            exit 1
          fi

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker image metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service.image }}
          tags: |
            type=raw,value=sha-${{ github.event.workflow_run.head_sha || github.sha }}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.service.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service.context }}
          file: ./${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.image }}
